name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      # -race: internal/worker documents that it serialises the live-log
      # callback, and the test for it only fails under the race detector.
      # Measured at +2s on this suite, because the slow package spends its
      # time waiting on subprocesses.
      # -count=1: setup-go restores the build cache, which carries cached test
      # results — a gate must re-run them.
      - name: Test
        run: go test -race -count=1 ./...

      # golangci-lint runs govet, so no separate vet step is needed.
      # Pinned, not @latest: the gate must be a function of this repo's code,
      # not of whichever linter version happened to publish today. Keep this in
      # step with the version developers run locally, and check it supports the
      # Go release `stable` resolves to — a static analyser panics on stdlib it
      # does not know (v2.12.x does exactly that on Go 1.27).
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Lint
        run: golangci-lint run

      - name: Dead code
        run: ./scripts/deadcode.sh
